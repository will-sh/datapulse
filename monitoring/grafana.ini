[paths]
provisioning = conf/provisioning

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 8100
serve_from_sub_path = false

[auth.anonymous]
enabled = true
org_role = Admin

[dashboards]
default_home_dashboard_path = conf/provisioning/dashboards/datapulse.json

[users]
default_theme = dark

[log]
mode = console
level = info
