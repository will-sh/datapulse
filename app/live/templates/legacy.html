<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy Stream Viewer</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 24px; background: #0b1020; color: #e5e7eb; }
    h1 { margin-bottom: 8px; }
    .meta { color: #94a3b8; margin-bottom: 20px; }
    .status { padding: 12px 16px; border-radius: 10px; background: #111827; margin-bottom: 16px; }
    .ok { color: #34d399; }
    .err { color: #f87171; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #1f2937; padding: 10px 8px; text-align: left; vertical-align: top; }
    th { color: #93c5fd; }
    code { white-space: pre-wrap; word-break: break-word; }
    .empty { color: #64748b; padding: 24px 0; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <p><a href="/live">← Back to Live Events</a></p>
  <h1>Spark Structured Streaming → Kafka (Legacy)</h1>
  <p class="meta">Topic: <strong>{{ topic }}</strong> · auto-refreshes every 3 seconds</p>
  <div id="status" class="status">Loading…</div>
  <table>
    <thead>
      <tr><th>Received at</th><th>Kafka time</th><th>Content</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    function fmt(ts) {
      if (!ts) return "-";
      return new Date(ts * 1000).toLocaleString("en-US");
    }
    async function refresh() {
      const res = await fetch("/api/messages");
      const data = await res.json();
      const status = document.getElementById("status");
      const rows = document.getElementById("rows");
      const active = data.stream_active ? "ok" : "err";
      status.innerHTML = `
        <div>Spark status: <span class="${active}">${data.spark_status}</span></div>
        <div>Consumed: <strong>${data.total_received}</strong> messages</div>
        ${data.last_error ? `<div class="err">Error: ${data.last_error}</div>` : ""}
      `;
      if (!data.events.length) {
        rows.innerHTML = '<tr><td colspan="3" class="empty">No messages yet. Trigger events in the datapulse-app behavior lab.</td></tr>';
        return;
      }
      rows.innerHTML = data.events.map((event) => {
        let pretty = event.message;
        try { pretty = JSON.stringify(JSON.parse(event.message), null, 2); } catch (_) {}
        return `<tr>
          <td>${fmt(event.received_at)}</td>
          <td>${event.kafka_timestamp || "-"}</td>
          <td><code>${pretty}</code></td>
        </tr>`;
      }).join("");
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
