<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataPulse Live Events</title>
  <link rel="stylesheet" href="/live/static/live.css">
  <link rel="stylesheet" href="/live/static/insights.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">DataPulse · Live Events</p>
      <h1>Live event stream</h1>
      <p class="subtitle">Topic: <strong id="topic-label">{{ topic }}</strong> · recent events in the in-memory window only</p>
    </div>
    <div class="topbar-actions">
      <nav class="consumer-nav">
        <a href="/live" class="link-muted is-active">Live Events</a>
        <a href="/insights" class="link-muted">Insights</a>
      </nav>
      <label class="refresh-toggle">
        <input type="checkbox" id="auto-refresh" checked>
        Auto-refresh (3s)
      </label>
      <a class="link-muted" href="/live/legacy">Legacy view</a>
    </div>
  </header>

  <section id="status-bar" class="status-bar">Loading…</section>

  <div class="layout">
    <aside class="sidebar">
      <h2>Filters</h2>
      <label class="field">
        <span>Event name</span>
        <select id="filter-name">
          <option value="">All</option>
        </select>
      </label>
      <label class="field">
        <span>User ID</span>
        <input id="filter-user" type="text" placeholder="Optional">
      </label>
      <button type="button" id="clear-filters" class="btn-secondary">Clear filters</button>

      <h2>Window stats</h2>
      <p class="hint">In-memory buffer only — not historical analytics</p>
      <div id="stats-panel" class="stats-panel"></div>
    </aside>

    <main class="main">
      <div id="events-list" class="events-list">
        <p class="empty">Loading…</p>
      </div>
    </main>
  </div>

  <script>
    window.DATAPULSE_LIVE = { topic: "{{ topic }}" };
  </script>
  <script src="/live/static/live.js"></script>
</body>
</html>
